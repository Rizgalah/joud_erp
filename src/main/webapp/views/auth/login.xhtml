<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      lang="ar" dir="rtl">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Joud ERP — تسجيل الدخول"/>
    <title>Joud ERP — تسجيل الدخول</title>

    <!-- PrimeFaces Theme -->
    <h:outputStylesheet library="primefaces" name="themes/saga/theme.css"/>
    <!-- Joud Login CSS -->
    <h:outputStylesheet library="css" name="login.css"/>
    <!-- PrimeIcons -->
    <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>
</h:head>

<h:body styleClass="login-page">

    <div class="login-card">

        <!-- ─── Logo ─────────────────────────────── -->
        <div class="login-logo">
            <div class="logo-circle">J</div>
            <span class="system-name">Joud ERP</span>
            <div class="system-sub">نظام إدارة الموارد</div>
        </div>

        <!-- ─── Form ──────────────────────────────── -->
        <h:form id="loginForm" autocomplete="off">

            <!-- رسائل الخطأ -->
            <p:messages id="messages" showDetail="false" closable="true">
                <p:autoUpdate/>
            </p:messages>

            <p:growl id="growl" life="4000" showDetail="false"/>

            <!-- اسم المستخدم -->
            <div class="login-field">
                <h:outputLabel for="username" value="اسم المستخدم"/>
                <div class="input-wrapper">
                    <i class="pi pi-user input-icon"/>
                    <p:inputText id="username"
                                 value="#{loginBean.username}"
                                 placeholder="أدخل اسم المستخدم"
                                 required="true"
                                 requiredMessage="اسم المستخدم مطلوب"
                                 autocomplete="username"
                                 maxlength="100">
                        <f:ajax event="blur" render="usernameMsg"/>
                    </p:inputText>
                </div>
                <p:message id="usernameMsg" for="username" display="text"/>
            </div>

            <!-- كلمة المرور -->
            <div class="login-field">
                <h:outputLabel for="password" value="كلمة المرور"/>
                <div class="input-wrapper">
                    <i class="pi pi-lock input-icon"/>
                    <p:password id="password"
                                value="#{loginBean.password}"
                                placeholder="أدخل كلمة المرور"
                                required="true"
                                requiredMessage="كلمة المرور مطلوبة"
                                feedback="false"
                                toggleMask="true"
                                autocomplete="current-password"
                                maxlength="100"/>
                </div>
                <p:message id="passwordMsg" for="password" display="text"/>
            </div>

            <!-- تذكرني -->
            <label class="login-remember">
                <p:selectBooleanCheckbox value="#{loginBean.rememberMe}"/>
                تذكرني لمدة أسبوع
            </label>

            <!-- زر الدخول -->
            <p:commandButton id="loginBtn"
                             value="تسجيل الدخول"
                             action="#{loginBean.login}"
                             styleClass="login-btn"
                             icon="pi pi-sign-in"
                             iconPos="right"
                             ajax="false"
                             onclick="this.classList.add('loading')"/>

        </h:form>

        <!-- ─── Footer ────────────────────────────── -->
        <div class="login-footer">
            Joud ERP v1.0.0 — جميع الحقوق محفوظة
        </div>

    </div>

    <script>
        // التركيز التلقائي على حقل اسم المستخدم
        window.addEventListener('load', function () {
            var u = document.getElementById('loginForm:username');
            if (u) u.focus();
        });

        // Enter key في حقل كلمة المرور → submit
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                var btn = document.getElementById('loginForm:loginBtn');
                if (btn) btn.click();
            }
        });
    </script>

</h:body>
</html>
