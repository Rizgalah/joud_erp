<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      lang="#{localeBean.language}"
      dir="#{localeBean.dir}">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Joud ERP — #{msg['login.title']}</title>

    <h:outputStylesheet library="primefaces" name="themes/saga/theme.css"/>
    <h:outputStylesheet library="css" name="login.css"/>
    <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>

    <!-- ─── CSS مبدّل اللغة ─── -->
    <style>
        .lang-switcher-login {
            position: absolute;
            top: 14px;
            left: 14px;
        }
        .lang-btn-login {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 20px;
            color: #1B3A6B;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            font-family: Arial, sans-serif;
        }
        .lang-btn-login:hover { background: rgba(255,255,255,0.3); }
        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            font-size: 12.5px;
            color: #2E75B6;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }
    </style>
</h:head>

<h:body styleClass="login-page">

<!-- f:view يضبط locale قبل Render لضمان تحميل Bundle الصحيح -->
<f:view locale="#{localeBean.locale}">

    <!-- ─── مبدّل اللغة (أعلى يسار الشاشة) ─── -->
    <h:form styleClass="lang-switcher-login">
        <p:commandLink
            value="English"
            action="#{localeBean.changeLanguage('en')}"
            rendered="#{localeBean.language eq 'ar'}"
            styleClass="lang-btn-login"
            ajax="false"/>
        <p:commandLink
            value="العربية"
            action="#{localeBean.changeLanguage('ar')}"
            rendered="#{localeBean.language eq 'en'}"
            styleClass="lang-btn-login"
            ajax="false"/>
    </h:form>

    <div class="login-card">

        <!-- ─── Logo ─────────────────────────────── -->
        <div class="login-logo">
            <div class="logo-circle">J</div>
            <span class="system-name">Joud ERP</span>
            <div class="system-sub">#{msg['login.subtitle']}</div>
        </div>

        <!-- ─── Form ──────────────────────────────── -->
        <h:form id="loginForm" autocomplete="off">

            <p:messages id="messages" showDetail="false" closable="true">
                <p:autoUpdate/>
            </p:messages>
            <p:growl id="growl" life="4000" showDetail="false"/>

            <!-- اسم المستخدم -->
            <div class="login-field">
                <h:outputLabel for="username" value="#{msg['login.username']}"/>
                <div class="input-wrapper">
                    <i class="pi pi-user input-icon"/>
                    <p:inputText id="username"
                                 value="#{loginBean.username}"
                                 placeholder="#{msg['login.username.placeholder']}"
                                 required="true"
                                 requiredMessage="#{msg['login.username.required']}"
                                 autocomplete="username"
                                 maxlength="100">
                        <f:ajax event="blur" render="usernameMsg"/>
                    </p:inputText>
                </div>
                <p:message id="usernameMsg" for="username" display="text"/>
            </div>

            <!-- كلمة المرور -->
            <div class="login-field">
                <h:outputLabel for="password" value="#{msg['login.password']}"/>
                <div class="input-wrapper">
                    <i class="pi pi-lock input-icon"/>
                    <p:password id="password"
                                value="#{loginBean.password}"
                                placeholder="#{msg['login.password.placeholder']}"
                                required="true"
                                requiredMessage="#{msg['login.password.required']}"
                                feedback="false"
                                toggleMask="true"
                                autocomplete="current-password"
                                maxlength="100"/>
                </div>
                <p:message id="passwordMsg" for="password" display="text"/>
            </div>

            <!-- تذكرني -->
            <label class="login-remember">
                <p:selectBooleanCheckbox value="#{loginBean.rememberMe}"/>
                #{msg['login.remember']}
            </label>

            <!-- زر الدخول -->
            <p:commandButton id="loginBtn"
                             value="#{msg['login.submit']}"
                             action="#{loginBean.login}"
                             styleClass="login-btn"
                             icon="pi pi-sign-in"
                             iconPos="right"
                             ajax="false"
                             onclick="this.classList.add('loading')"/>

            <!-- نسيت كلمة المرور -->
            <h:link outcome="/views/auth/forgot-password"
                    styleClass="forgot-link">
                #{msg['login.forgot.password']}
            </h:link>

        </h:form>

        <!-- ─── Footer ────────────────────────────── -->
        <div class="login-footer">
            #{msg['login.footer']}
        </div>

    </div>

</f:view>

<script>
    window.addEventListener('load', function () {
        var u = document.getElementById('loginForm:username');
        if (u) u.focus();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            var btn = document.getElementById('loginForm:loginBtn');
            if (btn) btn.click();
        }
    });
</script>

</h:body>
</html>
