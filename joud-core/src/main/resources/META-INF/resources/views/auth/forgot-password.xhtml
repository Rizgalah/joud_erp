<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      lang="#{localeBean.language}"
      dir="#{localeBean.dir}">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Joud ERP — #{msg['reset.forgot.title']}</title>

    <h:outputStylesheet library="primefaces" name="themes/saga/theme.css"/>
    <h:outputStylesheet library="css" name="login.css"/>
    <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>

    <style>
        .forgot-card {
            max-width: 420px;
            margin: 0 auto;
            padding: 40px 38px;
        }
        .forgot-icon {
            font-size: 48px;
            color: #2E75B6;
            display: block;
            text-align: center;
            margin-bottom: 14px;
        }
        .forgot-title {
            font-size: 22px;
            font-weight: 800;
            color: #1B3A6B;
            text-align: center;
            margin-bottom: 6px;
        }
        .forgot-sub {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .success-box {
            background: #e1f5ee;
            border: 1px solid #0F6E56;
            border-radius: 10px;
            padding: 18px 20px;
            text-align: center;
            color: #0F6E56;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .success-box .pi {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        .note-box {
            background: #fff8e1;
            border-right: 4px solid #ffc107;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12.5px;
            color: #856404;
            margin-top: 12px;
        }
        .lang-switcher-login {
            position: absolute;
            top: 14px;
            left: 14px;
        }
        .lang-btn-login {
            background: rgba(27,58,107,0.08);
            border: 1px solid #d0d9e8;
            border-radius: 20px;
            color: #1B3A6B;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            font-family: Arial, sans-serif;
        }
        .lang-btn-login:hover { background: rgba(27,58,107,0.15); }
    </style>
</h:head>

<h:body styleClass="login-page">
<f:view locale="#{localeBean.locale}">

    <!-- مبدّل اللغة -->
    <h:form styleClass="lang-switcher-login">
        <p:commandLink value="English"
                       action="#{localeBean.changeLanguage('en')}"
                       rendered="#{localeBean.language eq 'ar'}"
                       styleClass="lang-btn-login" ajax="false"/>
        <p:commandLink value="العربية"
                       action="#{localeBean.changeLanguage('ar')}"
                       rendered="#{localeBean.language eq 'en'}"
                       styleClass="lang-btn-login" ajax="false"/>
    </h:form>

    <div class="login-card forgot-card">

        <!-- أيقونة -->
        <div class="login-logo">
            <div class="logo-circle">J</div>
            <span class="system-name">Joud ERP</span>
        </div>

        <i class="pi pi-lock forgot-icon" style="margin-top:14px"/>
        <div class="forgot-title">#{msg['reset.forgot.title']}</div>
        <div class="forgot-sub">#{msg['reset.forgot.subtitle']}</div>

        <h:form id="forgotForm">
            <p:messages id="msgs" showDetail="false" closable="true"/>

            <!-- ─── حالة النجاح ─── -->
            <h:panelGroup rendered="#{forgotBean.sent}">
                <div class="success-box">
                    <i class="pi pi-check-circle"/>
                    #{msg['reset.link.sent']}
                </div>
                <div class="note-box">
                    <i class="pi pi-info-circle" style="margin-left:5px"/>
                    #{msg['reset.link.note']}
                </div>
            </h:panelGroup>

            <!-- ─── نموذج الإدخال ─── -->
            <h:panelGroup rendered="#{not forgotBean.sent}">
                <div class="login-field">
                    <h:outputLabel for="email" value="#{msg['reset.email']}"/>
                    <div class="input-wrapper">
                        <i class="pi pi-envelope input-icon"/>
                        <p:inputText id="email"
                                     value="#{forgotBean.email}"
                                     placeholder="#{msg['reset.email.placeholder']}"
                                     required="true"
                                     requiredMessage="#{msg['reset.email.required']}"
                                     type="email"
                                     maxlength="150"
                                     style="width:100%"/>
                    </div>
                    <p:message for="email" display="text"/>
                </div>

                <p:commandButton value="#{msg['reset.send.link']}"
                                 action="#{forgotBean.sendResetLink}"
                                 icon="pi pi-send"
                                 iconPos="right"
                                 styleClass="login-btn"
                                 ajax="false"/>
            </h:panelGroup>

        </h:form>

        <!-- رابط العودة -->
        <div class="login-footer" style="margin-top:18px">
            <h:link outcome="/views/auth/login" style="color:#2E75B6;text-decoration:none">
                <i class="pi pi-arrow-right" style="font-size:11px;margin-left:4px"/>
                #{msg['reset.back.to.login']}
            </h:link>
        </div>

    </div>

</f:view>
</h:body>
</html>
